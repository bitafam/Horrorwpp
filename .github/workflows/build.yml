name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean up old artifacts to free quota
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              const res = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              for (const artifact of res.data.artifacts) {
                console.log(`Deleting old artifact: ${artifact.name} (id: ${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
              console.log('Artifact cleanup completed.');
            } catch (err) {
              console.log('Error cleaning up artifacts (proceeding anyway):', err.message);
            }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -keyalg RSA -keysize 2048 -validity 10000 \
              -alias androiddebugkey -keypass android -storepass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --build-cache --parallel --no-daemon

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HorrorApp-v${{ github.run_number }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk HorrorApp.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "HorrorApp v${{ github.run_number }}"
          body: |
            ## نسخه جدید اپلیکیشن عمارت وحشت گوتیک
            - **شماره ساخت (Run Number):** ${{ github.run_number }}
            - **شناسه کامیت:** ${{ github.sha }}
            
            فایل APK را از بخش **Assets** در پایین همین صفحه دانلود و روی گوشی نصب کنید.
          files: |
            HorrorApp-v${{ github.run_number }}.apk
            HorrorApp.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

