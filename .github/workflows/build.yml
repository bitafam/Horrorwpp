name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'web-admin/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean up old artifacts to free quota
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            try {
              const res = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              for (const artifact of res.data.artifacts) {
                console.log(`Deleting old artifact: ${artifact.name} (id: ${artifact.id})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
              console.log('Artifact cleanup completed.');
            } catch (err) {
              console.log('Error cleaning up artifacts (proceeding anyway):', err.message);
            }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -keyalg RSA -keysize 2048 -validity 10000 \
              -alias androiddebugkey -keypass android -storepass android \
              -dname "CN=HorrorHouse,OU=Production,O=HorrorHouse,L=Tehran,ST=Tehran,C=IR"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Sign APK (v1, v2, v3 Schemes)
        run: |
          ./gradlew assembleRelease --build-cache --parallel --no-daemon || ./gradlew assembleDebug --build-cache --parallel --no-daemon
          
          # Locate built APK
          BUILT_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found built APK: $BUILT_APK"
          
          # Determine keystore to use (Production Release Keystore)
          KEYSTORE="my-upload-key.jks"
          KS_PASS="HorrorHouse2026Secure"
          KEY_PASS="HorrorHouse2026Secure"
          KEY_ALIAS="horrorhouse"
          
          # Ensure unsigned / clean APK
          cp "$BUILT_APK" app-to-align.apk
          
          # Find Android build-tools
          BUILD_TOOLS_DIR=$(find /usr/local/lib/android/sdk/build-tools /opt/android/sdk/build-tools $ANDROID_HOME/build-tools -name apksigner 2>/dev/null | head -n 1 | xargs dirname)
          echo "Using build tools from: $BUILD_TOOLS_DIR"
          
          # Align APK
          $BUILD_TOOLS_DIR/zipalign -v -p -f 4 app-to-align.apk app-aligned.apk
          
          # Sign APK with v1, v2, and v3 schemes explicitly
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out HorrorApp.apk \
            app-aligned.apk
            
          # Verify signatures (including v1 with min-sdk 21 check)
          echo "=== APK Signature Verification ==="
          $BUILD_TOOLS_DIR/apksigner verify --verbose --min-sdk-version 21 HorrorApp.apk
          
          cp HorrorApp.apk HorrorApp-v${{ github.run_number }}.apk
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "HorrorApp v${{ github.run_number }}"
          body: |
            ## نسخه جدید اپلیکیشن عمارت وحشت گوتیک
            - **شماره ساخت (Run Number):** ${{ github.run_number }}
            - **شناسه کامیت:** ${{ github.sha }}
            
            فایل APK را از بخش **Assets** در پایین همین صفحه دانلود و روی گوشی نصب کنید.
          files: |
            HorrorApp-v${{ github.run_number }}.apk
            HorrorApp.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

